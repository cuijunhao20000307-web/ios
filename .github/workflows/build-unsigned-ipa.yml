name: Build PocketLedger unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PocketLedger/**'
      - 'PocketLedger.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build-unsigned-ipa.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore original icon
        run: python3 scripts/restore_icon.py
      - name: Build iOS app without signing
        run: |
          set -o pipefail
          xcodebuild -project PocketLedger.xcodeproj -scheme PocketLedger -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Package IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PocketLedger.app package/Payload/
          cd package
          zip -qry PocketLedger-v0.3.0-unsigned.ipa Payload
          unzip -t PocketLedger-v0.3.0-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-v0.3.0-unsigned-ipa
          path: package/PocketLedger-v0.3.0-unsigned.ipa
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-build-log
          path: build.log
          if-no-files-found: ignore
