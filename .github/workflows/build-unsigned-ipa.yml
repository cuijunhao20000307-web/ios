name: Build PocketLedger unsigned IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'PocketLedger/**'
      - 'PocketLedger.xcodeproj/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-unsigned-ipa.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Duo SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk"
          python3 -c 'import sys; v=tuple(int(x) for x in sys.argv[1].split(".")[:2]); assert v >= (27, 1), "iOS 27.1+ SDK required for native Duo bars"' "$sdk"
      - name: Check card motion and original balance covers
        run: |
          swiftc PocketLedger/Sources/WalletCardMotion.swift tests/WalletCardMotionTests.swift -o /tmp/wallet-motion-tests
          /tmp/wallet-motion-tests
          python3 scripts/verify_balance_covers.py
      - name: Restore original icon
        run: python3 scripts/restore_icon.py
      - name: Retrieve remaining bank logos
        run: python3 scripts/fetch_bank_logos.py
      - name: Build iOS app without signing
        run: |
          set -o pipefail
          xcodebuild -project PocketLedger.xcodeproj -scheme PocketLedger -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Verify covers in compiled app
        run: python3 scripts/verify_balance_covers.py --app build/Build/Products/Release-iphoneos/PocketLedger.app
      - name: Package IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PocketLedger.app package/Payload/
          cd package
          zip -qry PocketLedger-v0.4.53-unsigned.ipa Payload
          unzip -t PocketLedger-v0.4.53-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-v0.4.53-unsigned-ipa
          path: package/PocketLedger-v0.4.53-unsigned.ipa
          if-no-files-found: error
      # Public Release assets have direct HTTPS download URLs, unlike the
      # GitHub Actions artifact API, whose ZIP download requires authentication.
      # This is an UNSIGNED IPA and cannot silently install itself on iOS.
      - name: Publish IPA to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep -m1 'MARKETING_VERSION = ' PocketLedger.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9.]+);/\1/')"
          tag="v${version}"
          ipa="package/PocketLedger-v${version}-unsigned.ipa"
          echo "Unsigned IPA. Must be signed with the user's valid iOS provisioning identity before installation." > /tmp/digital-wallet-notes.md
          echo "v0.4.53 Build 60: centered curved card stack, spring reorder and shared-element transitions, staggered blurred return and complete home-state restoration. Original card data and currency covers unchanged." >> /tmp/digital-wallet-notes.md
          echo "Real-device testing remains pending: Duo inner/outer transitions, scrolling/pull cancellation, long-press reorder, Face ID, security cards, backup/restore and in-app update. CI does not establish visual parity with Apple Wallet." >> /tmp/digital-wallet-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ipa" --clobber
          else
            gh release create "$tag" "$ipa" --title "Digital Wallet $tag (unsigned)" --notes-file /tmp/digital-wallet-notes.md
          fi
      # UI testing is diagnostic until the simulator harness is stable.
      # Never let a simulator timeout prevent a correctly compiled IPA from
      # being packaged and uploaded; keep failed test logs as a separate artifact.
      - name: Exercise wallet rendering and gestures on compact and wide simulators
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/run_wallet_ui_tests.py > ui-test.log 2>&1
      - name: Upload simulator verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-wallet-ui-verification
          path: |
            ui-results/
            ui-test.log
          if-no-files-found: ignore
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-build-log
          path: build.log
          if-no-files-found: ignore
