name: Export PocketLedger source for Codex

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CODEX_HANDOFF.md'
      - '.github/workflows/export-codex-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exactly the checked-in source (no build products, no .git)
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/PocketLedger-Codex-Source.zip" HEAD
          unzip -t "$RUNNER_TEMP/PocketLedger-Codex-Source.zip" | tail -1
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-Codex-Source
          path: ${{ runner.temp }}/PocketLedger-Codex-Source.zip
          if-no-files-found: error
          retention-days: 30
